[versions]
agp              = "8.5.2"
kotlin           = "2.2.0"
ksp              = "2.2.0-2.0.2"         # must match kotlin version prefix
compose-bom      = "2024.09.00"
hilt             = "2.56.2"
room             = "2.7.0"
lifecycle        = "2.8.4"
coroutines       = "1.8.1"
core-ktx          = "1.13.1"
core-splashscreen = "1.0.1"
play-review       = "2.0.2"
play-update       = "2.1.0"
genai-prompt     = "1.0.0-beta2"
litertlm         = "0.13.1"
androidx-graphics-path = "1.1.0"
profileinstaller = "1.4.1"
benchmark         = "1.3.3"          # macrobenchmark + androidx.baselineprofile plugin
uiautomator       = "2.3.0"
androidx-test-ext = "1.2.1"
androidx-test-core = "1.6.1"
junit             = "4.13.2"

[libraries]
litertlm-android = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }
androidx-graphics-path = { group = "androidx.graphics", name = "graphics-path", version.ref = "androidx-graphics-path" }
# ── AndroidX core ─────────────────────────────────────────────────────────────
androidx-core-ktx             = { group = "androidx.core",              name = "core-ktx",                   version.ref = "core-ktx" }
androidx-profileinstaller     = { group = "androidx.profileinstaller",  name = "profileinstaller",           version.ref = "profileinstaller" }
core-splashscreen             = { group = "androidx.core",              name = "core-splashscreen",          version.ref = "core-splashscreen" }
play-review                   = { group = "com.google.android.play",   name = "review-ktx",                 version.ref = "play-review" }
play-update                   = { group = "com.google.android.play",   name = "app-update-ktx",             version.ref = "play-update" }

# ── Compose BOM (manages all compose artifact versions) ───────────────────────
compose-bom                   = { group = "androidx.compose",           name = "compose-bom",                version.ref = "compose-bom" }
compose-ui                    = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-tooling            = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-ui-tooling-preview    = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-material3             = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-ext    = { group = "androidx.compose.material",  name = "material-icons-extended" }
compose-activity              = { group = "androidx.activity",          name = "activity-compose",           version = "1.9.1" }

# ── Lifecycle / ViewModel ─────────────────────────────────────────────────────
lifecycle-viewmodel-compose   = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",version.ref = "lifecycle" }
lifecycle-runtime-compose     = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",  version.ref = "lifecycle" }

# ── Room ──────────────────────────────────────────────────────────────────────
# ✅ KSP processor — NOT kapt
room-runtime                  = { group = "androidx.room",              name = "room-runtime",               version.ref = "room" }
room-ktx                      = { group = "androidx.room",              name = "room-ktx",                   version.ref = "room" }
room-compiler                 = { group = "androidx.room",              name = "room-compiler",              version.ref = "room" }   # used with ksp()
room-testing                  = { group = "androidx.room",              name = "room-testing",               version.ref = "room" }

# ── Hilt ──────────────────────────────────────────────────────────────────────
hilt-android                  = { group = "com.google.dagger",          name = "hilt-android",               version.ref = "hilt" }
hilt-compiler                 = { group = "com.google.dagger",          name = "hilt-android-compiler",      version.ref = "hilt" }  # used with ksp()
hilt-navigation-compose       = { group = "androidx.hilt",              name = "hilt-navigation-compose",    version = "1.2.0" }

# ── Coroutines ────────────────────────────────────────────────────────────────
coroutines-android            = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ── ML Kit GenAI Prompt API (Gemini Nano on-device) ──────────────────────────
genai-prompt                  = { group = "com.google.mlkit",           name = "genai-prompt",               version.ref = "genai-prompt" }

# ── Baseline profile / macrobenchmark (":baselineprofile" module) ─────────────
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark",        name = "benchmark-macro-junit4",    version.ref = "benchmark" }
androidx-test-ext-junit        = { group = "androidx.test.ext",          name = "junit",                     version.ref = "androidx-test-ext" }
androidx-test-core-ktx         = { group = "androidx.test",              name = "core-ktx",                  version.ref = "androidx-test-core" }
androidx-uiautomator           = { group = "androidx.test.uiautomator",  name = "uiautomator",               version.ref = "uiautomator" }
junit                         = { group = "junit",                      name = "junit",                     version.ref = "junit" }

[plugins]
android-application           = { id = "com.android.application",            version.ref = "agp" }
kotlin-android                = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
# ✅ Required since Kotlin 2.0 — replaces composeOptions.kotlinCompilerExtensionVersion
kotlin-compose                = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# ✅ KSP plugin — replaces kotlin-kapt
ksp                           = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
hilt                          = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
android-asset-pack            = { id = "com.android.asset-pack",             version.ref = "agp" }
android-test                  = { id = "com.android.test",                    version.ref = "agp" }
baselineprofile               = { id = "androidx.baselineprofile",            version.ref = "benchmark" }
